# Side projects. Add an entry and it appears on the site automatically.
# url can be an internal redirect (e.g. /wordle-opener) or an external link.
sideprojects:
  - name: Wordle Opener
    tagline: Optimal starting-word solver
    description: A tool that ranks Wordle opening guesses by expected information gain — entropy scoring over the full answer set to find the words that carve the search space fastest.
    url: /wordle-opener
    tags: [Python, Information Theory, Web]
    status: live

  - name: Mahjong
    tagline: Tile game in the browser
    description: A playable Mahjong build — tile matching, layouts, and scoring, running entirely client-side.
    url: /mahjong
    tags: [JavaScript, Game, Web]
    status: live

